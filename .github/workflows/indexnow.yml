# After each successful Vercel production deploy, submit new or changed pages
# to IndexNow (Bing, Yandex and others). See scripts/indexnow.mjs.
#
# The manifest from the last submission is kept as a run artifact (the Actions
# cache is not available to deployment_status events).
name: IndexNow

on:
  deployment_status:

concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  submit:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find last successful run
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow indexnow.yml --status success --limit 1 --json databaseId -q '.[0].databaseId // empty')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - name: Download last submitted manifest
        if: steps.last.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-manifest
          path: .indexnow
          run-id: ${{ steps.last.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Submit changed pages
        run: node scripts/indexnow.mjs --previous .indexnow/manifest.json --save .indexnow/manifest.json

      - name: Save manifest for the next run
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-manifest
          path: .indexnow/manifest.json
          retention-days: 90
